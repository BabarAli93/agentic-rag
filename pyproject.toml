[project]
name = "agentic-rag"
version = "1.3.0"
description = "A tenant-aware agentic RAG workbench for document and website question answering"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chainlit>=2.12.0",
    "deepagents>=0.7.23",
    "docx2txt>=0.9",
    "fastapi>=0.143.0",
    "fastembed>=0.9.0",
    "flashrank>=0.2.10",
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-google-vertexai>=3.2.5",
    "langchain-huggingface[full]>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "lxml>=6.1.3",
    "pyjwt[crypto]>=2.10,<3",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "pytube>=15.0.0",
    "qdrant-client>=1.19.1",
    "ragas>=0.4.3",
    "requests>=2.34.2",
    "tabulate>=0.10.0",
    "uvicorn>=0.54.0",
    "youtube-transcript-api>=1.2.4",
]
